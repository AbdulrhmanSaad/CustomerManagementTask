syntax = "proto3";
import "google/protobuf/empty.proto";

option csharp_namespace = "CustomersTask4";

package UserGRPC;

service GetUserGRPC {
  rpc GettUserData (google.protobuf.Empty) returns (UserResponse);
}

message UserResponse {
  string user_id = 1;
  string user_name=2;
  repeated string roles = 3;
}